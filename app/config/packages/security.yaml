security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Usuario
                property: email

    role_hierarchy:
        ROLE_ADMIN: [ROLE_LOGISTICA, ROLE_CLIENTE, ROLE_CONTABILIDAD, ROLE_USER]
        ROLE_LOGISTICA: [ROLE_USER]
        ROLE_CLIENTE: [ROLE_USER]
        ROLE_CONTABILIDAD: [ROLE_USER]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_acceso
                check_path: app_acceso
                default_target_path: app_inicio
                username_parameter: email
                password_parameter: password
            logout:
                path: app_cerrar_sesion
                target: app_acceso

    access_control:
        - { path: ^/locale, roles: PUBLIC_ACCESS }
        - { path: ^/acceso, roles: PUBLIC_ACCESS }
        - { path: ^/registro, roles: PUBLIC_ACCESS }
        - { path: ^/tienda, roles: PUBLIC_ACCESS }
        - { path: ^/cliente, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/logistica, roles: ROLE_LOGISTICA }
        - { path: ^/contabilidad, roles: ROLE_CONTABILIDAD }
        - { path: ^/mi-cuenta, roles: ROLE_CLIENTE }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Los hashers de contraseña son costosos por diseño para garantizar la seguridad.
            # En pruebas es seguro reducir su coste para mejorar el rendimiento.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
